const modalPlay=document.getElementById('modal-play'),modalPrev=document.getElementById('modal-prev'),modalNext=document.getElementById('modal-next');
const modalPlayIcon = document.getElementById('modal-play-icon');
const lyricBox = document.getElementById('lyric-box'), detailTitle=document.getElementById('detail-title');
const modalCur = document.getElementById('modal-cur'), modalDur = document.getElementById('modal-dur');
const modalProgress = document.getElementById('modal-progress'), modalProgressBar = document.getElementById('modal-progress-bar'),modalProgressDot=document.getElementById('modal-progress-dot');
const modalVolume = document.getElementById('modal-volume');
const gotoPlayerBtn = document.getElementById('goto-player-btn');
const albumArtImg = document.getElementById('album-art-img');
const detailModalBg = document.getElementById('detail-modal-bg');
const playerModalTitle = document.getElementById('player-modal-title');
const playerModalArtist = document.getElementById('player-modal-artist');
const rotatingAlbumArt = document.getElementById('rotating-album-art');
const playerModalOuter = document.getElementById('player-modal-outer-container');
function getAllTags(list){const set=new Set();list.forEach(s=>s.tags?.forEach(t=>set.add(t)));return Array.from(set);}
function idxOfSong(song){return songData.findIndex(s=>s.title===song.title);}
function renderSongCards(list, container, filterTag){
  container.innerHTML="";
  (filterTag?list.filter(s=>s.tags?.includes(filterTag)):list)
    .forEach((s,idx)=>{
      const li=document.createElement('li');
      li.className="song-card";li.tabIndex=0;
      li.innerHTML=`<span class="song-title">${s.title}</span>${(s.tags||[]).map(t=>`<span class="song-tags">${t}</span>`).join('')}`;
      li.onclick=()=>{openModal(idxOfSong(s));}
      li.onkeydown=e=>{ if(e.key==="Enter") openModal(idxOfSong(s)); }
      container.appendChild(li);
    });
}
function renderFilterBar(tags, barEl, onChange){
  barEl.innerHTML='<button class="filter-btn active">全部</button>';
  tags.forEach(t=>{
    const btn=document.createElement('button');
    btn.className="filter-btn";btn.textContent=t;
    barEl.appendChild(btn);
  });
  Array.from(barEl.children).forEach((btn,idx)=>{
    btn.onclick=function(){
      Array.from(barEl.children).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      onChange(idx===0?null:tags[idx-1]);
    }
  });
}
const worksList=document.getElementById('works-list');
const genresList=document.getElementById('genres-list');
const workTags=getAllTags(songData), genreTags=workTags;
renderFilterBar(workTags,document.getElementById('workFilterBar'),t=>{renderSongCards(songData,worksList,t);});
renderFilterBar(genreTags,document.getElementById('genreFilterBar'),t=>{renderSongCards(songData,genresList,t);});
renderSongCards(songData,worksList);renderSongCards(songData,genresList);
function persistPlayerCache() {
  try{sessionStorage.setItem('playerCache',JSON.stringify(playerCache));}catch(e){}
}
function retrievePlayerCache() {
  try{const v = sessionStorage.getItem('playerCache'); if(v) Object.assign(playerCache,JSON.parse(v));}catch(e){}
}
retrievePlayerCache();
let visiblePage = "home";
function switchPage(pageName) {
  visiblePage = pageName;
  document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active',b.dataset.page===pageName));
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
  const next=document.getElementById(pageName);
  if(next) next.classList.add('active');
}
function formatTime(s){
  if(isNaN(s)||!isFinite(s))return"00:00";
  let m=Math.floor(s/60),sec=Math.floor(s%60);
  return (m<10?"0"+m:m)+":"+((sec<10)?"0"+sec:sec);
}
function parseLyric(lrc){
  let lines=(lrc||"").split('\n'), result=[];
  const timeExp=/\[(\d{2}):(\d{2}(?:\.\d{1,2})?)\]/g;
  for(const line of lines){
    let matches=[...line.matchAll(timeExp)];
    if(matches.length>0){
      let text=line.replace(timeExp,"").trim();
      matches.forEach(m=>{
        let t=parseInt(m[1],10)*60+parseFloat(m[2]);
        result.push({time:t, text});
      });
    }else if(line.trim()!==""){result.push({time:-1,text:line.trim()});}
  }
  result.sort((a,b)=>a.time-b.time);
  return result;
}
function renderLyricBox(text, anchorTime) {
  lyricBox.innerHTML="";
  lyricEntries=parseLyric(text).map((line,idx)=>{
    let el=document.createElement('div');
    el.className="lyric-line";
    el.textContent=line.text||'';
    lyricBox.appendChild(el);
    return {...line,dom:el};
  });
  lastActiveLine=-1;
  syncLyric(anchorTime??(audio.currentTime||0), true);
}
function syncLyric(currentTime, forceFirst){
  if(!lyricEntries.length)return;
  let idx=0;
  for(let i=0;i<lyricEntries.length;i++){
    if(lyricEntries[i].time!==-1&&currentTime>=lyricEntries[i].time)idx=i;
  }
  if(forceFirst) idx=0;
  if(idx!==lastActiveLine){
    if(lastActiveLine>=0)lyricEntries[lastActiveLine].dom.classList.remove('active');
    if(idx>=0)lyricEntries[idx].dom.classList.add('active');
    lastActiveLine=idx;
    let box=lyricBox, act=lyricEntries[idx].dom;
    if(box&&act){
      let scrollTop=act.offsetTop-box.offsetHeight/2+act.offsetHeight/2;
      box.scrollTo({top:scrollTop,behavior:'smooth'});
    }
  }
}
function updatePlayerProgressBar(){
  let pct=audio.currentTime/(audio.duration||1);
  gProgressBar.style.width=(pct*100)+"%";
  let dotx=(gProgress.offsetWidth-14)*pct;
  gProgressDot.style.left=(isNaN(dotx)?0:dotx)+"px";
  gCur.textContent=formatTime(audio.currentTime);
}
function updateModalProgressBar(){
  let pct=audio.currentTime/(audio.duration||1);
  modalProgressBar.style.width=(pct*100)+"%";
  let dotx=(modalProgress.offsetWidth-14)*pct;
  modalProgressDot.style.left=(isNaN(dotx)?0:dotx)+"px";
  modalCur.textContent=formatTime(audio.currentTime);
}
function playSong(idx, autoPlay, restoreState) {
  currentIdx=idx;
  const song=songData[idx];
  // 统一路径大小写防止github云端跨域无法播放
  let fileUrl = (song.file||"").replace(/\\/g,'/').replace(/^(\.\/|\/)/,'');
  if (location.protocol.startsWith('http') && /github\.io/.test(location.host)) {
    fileUrl = fileUrl.replace(/[\\ ]/g, function(m) { return m === ' ' ? '%20' : '/'; });
  }
  // 设置audio标签source src
  if(audioSrcMp3 && audioSrcMp3.src !== location.origin + '/' + fileUrl) {
    // 若有host,用相对路径以适配github.io
    audioSrcMp3.src = fileUrl;
    audio.load();
  }
  document.title=song.title+" - 音乐作品集";
  gDur.textContent=song.duration;
  detailTitle.textContent=song.title;
  albumArtImg.src = song.albumArt || "Cover.jpg";
  if (rotatingAlbumArt) rotatingAlbumArt.src = song.albumArt || "Cover.jpg";
  renderLyricBox(song.lyric, restoreState?.time||0);
  modalDur.textContent=song.duration;
  if(modalContent.classList.contains('fullscreen')) {
    if(rotatingAlbumArt){
      rotatingAlbumArt.src = song.albumArt || "Cover.jpg";
      rotatingAlbumArt.style.display = "block";
    }
    if(playerModalTitle) {
      playerModalTitle.textContent = song.title || '';
      playerModalTitle.style.display = "block";
    }
    if(playerModalArtist) {
      playerModalArtist.textContent = song.artist || '';
      playerModalArtist.style.display = song.artist ? "block":"none";
    }
  } else {
    if(rotatingAlbumArt) rotatingAlbumArt.style.display = "none";
    if(playerModalTitle) playerModalTitle.style.display = "none";
    if(playerModalArtist) playerModalArtist.style.display = "none";
  }
  if(detailModalBg){
    detailModalBg.style.backgroundImage = song.albumArt
      ? `url('${song.albumArt}')`
      : "none";
    detailModalBg.style.backgroundSize = "cover";
    detailModalBg.style.backgroundPosition = "center center";
  }
  if(typeof restoreState === 'object') {
    audio.currentTime = restoreState.time || 0;
    audio.volume = isFinite(restoreState.volume)? restoreState.volume : 0.8;
    updatePlayerProgressBar();
    updateModalProgressBar();
    if(restoreState.isPlaying) audio.play(); else audio.pause();
    setTimeout(() => { syncLyric(audio.currentTime, false); }, 40);
  } else if(autoPlay) {
    audio.play();
  }
  playerCache.idx = idx;
  playerCache.time = audio.currentTime;
  playerCache.isPlaying = !audio.paused;
  playerCache.volume = audio.volume;
  persistPlayerCache();
}
function openModal(idx){
  lastModalOpenIdx = idx;
  playerCache.time = audio.currentTime; playerCache.idx = currentIdx;
  playerCache.isPlaying = !audio.paused; playerCache.volume = audio.volume;
  persistPlayerCache();
  playSong(idx, false, {time:playerCache.time,isPlaying:playerCache.isPlaying,volume:playerCache.volume});
  setTimeout(()=>{
    modal.classList.add('active');
    modal.focus();
    modalContent.classList.add('fullscreen');
    modalClose.style.display='block';
    if(rotatingAlbumArt) rotatingAlbumArt.style.display = 'block';
    if(playerModalTitle) playerModalTitle.style.display = 'block';
    if(detailModalBg){
      detailModalBg.style.opacity='.38';
    }
  },0);
  syncLyric(audio.currentTime,false);
  updateGotoPlayerBtn();
}
function closeModal(){
  modal.classList.remove('active');
  modalContent.classList.remove('fullscreen');
  modalClose.style.display='none';
  if(detailModalBg)
    detailModalBg.style.opacity='0';
  if(rotatingAlbumArt) rotatingAlbumArt.style.display = 'none';
  if(playerModalTitle) playerModalTitle.style.display = 'none';
  if(playerModalArtist) playerModalArtist.style.display = 'none';
  switchPage('works');
  updateGotoPlayerBtn();
}
modalClose.onclick=closeModal;
modal.onclick=e=>{if(e.target===modal)closeModal();}
document.addEventListener('keydown',e=>{
  if(modal.classList.contains('active') && e.key==='Escape') closeModal();
});
modalPlay.onclick=()=>{ if(audio.paused){audio.play();}else{audio.pause();} }
modalPrev.onclick=()=>{if(currentIdx>0)openModal(currentIdx-1);}
modalNext.onclick=()=>{if(currentIdx+1<songData.length)openModal(currentIdx+1);}
gPrev.onclick=()=>{if(currentIdx>0)openModal(currentIdx-1);}
gNext.onclick=()=>{if(currentIdx+1<songData.length)openModal(currentIdx+1);}
gPlay.onclick=()=>{if(audio.paused)audio.play();else audio.pause();}
audio.addEventListener('volumechange',function(){
  gVolume.value=audio.volume;
  modalVolume.value=audio.volume;
  playerCache.volume = audio.volume;
  persistPlayerCache();
});
audio.addEventListener('play',function(){
  gPlay.innerHTML=modalPlayIcon.innerHTML="&#10073;&#10073;";
  playerCache.isPlaying=true;persistPlayerCache();
});
audio.addEventListener('pause',function(){
  gPlay.innerHTML=modalPlayIcon.innerHTML="&#9654;";
  playerCache.isPlaying=false;persistPlayerCache();
});
audio.addEventListener('loadedmetadata',function(){
  gDur.textContent=formatTime(audio.duration);
  modalDur.textContent=formatTime(audio.duration);
  if(playerCache.idx==currentIdx && playerCache.time && Math.abs(audio.currentTime-playerCache.time)>1){
    audio.currentTime = playerCache.time;
    updatePlayerProgressBar(); updateModalProgressBar();
  }
});
audio.addEventListener('timeupdate',function(){
  updatePlayerProgressBar();
  updateModalProgressBar();
  syncLyric(audio.currentTime);
  playerCache.time = audio.currentTime;
  persistPlayerCache();
});
audio.addEventListener('seeked',function(){
  syncLyric(audio.currentTime,true);
  updatePlayerProgressBar();
  updateModalProgressBar();
  playerCache.time = audio.currentTime;
  persistPlayerCache();
});
audio.addEventListener('ended',function(){if(currentIdx+1<songData.length)openModal(currentIdx+1);});
gVolume.value=playerCache.volume;
audio.volume=gVolume.value;
gVolume.oninput=function(){
  audio.volume=parseFloat(gVolume.value);
};
modalVolume.value=playerCache.volume;
modalVolume.oninput=function(){
  audio.volume=parseFloat(modalVolume.value);
};
let isDragging=false;
function setProgressTo(xClient){
  const rect=gProgress.getBoundingClientRect();
  const x=Math.max(0,Math.min(rect.width,xClient-rect.left));
  let pct=x/rect.width;
  audio.currentTime = pct*(audio.duration||1);
  updatePlayerProgressBar();
  updateModalProgressBar();
  syncLyric(audio.currentTime,true);
}
gProgress.addEventListener('mousedown',function(e){
  isDragging=true;
  setProgressTo(e.clientX);
  window.addEventListener('mousemove',dragMove);
  window.addEventListener('mouseup',dragEnd);
});
gProgress.addEventListener('touchstart',function(e){
  isDragging=true;
  if(e.touches&&e.touches.length>0)setProgressTo(e.touches[0].clientX);
  window.addEventListener('touchmove',dragMove);
  window.addEventListener('touchend',dragEnd);
},{passive:true});
function dragMove(e){
  if(!isDragging)return;
  if(e.touches && e.touches.length>0)setProgressTo(e.touches[0].clientX);
  else setProgressTo(e.clientX);
}
function dragEnd(e){
  isDragging=false;
  window.removeEventListener('mousemove',dragMove);
  window.removeEventListener('mouseup',dragEnd);
  window.removeEventListener('touchmove',dragMove);
  window.removeEventListener('touchend',dragEnd);
}
gProgress.addEventListener('click',function(e){
  if(!isDragging)setProgressTo(e.clientX ?? (e.touches&&e.touches.length>0?e.touches[0].clientX:0));
});
let isModalDragging=false;
function setModalProgressTo(xClient){
  const rect=modalProgress.getBoundingClientRect();
  const x=Math.max(0,Math.min(rect.width,xClient-rect.left));
  let pct=x/rect.width;
  audio.currentTime = pct*(audio.duration||1);
  updateModalProgressBar();
  updatePlayerProgressBar();
  syncLyric(audio.currentTime,true);
}
modalProgress.addEventListener('mousedown',function(e){
  isModalDragging=true;
  setModalProgressTo(e.clientX);
  window.addEventListener('mousemove',modalDragMove);
  window.addEventListener('mouseup',modalDragEnd);
});
modalProgress.addEventListener('touchstart',function(e){
  isModalDragging=true;
  if(e.touches&&e.touches.length>0)setModalProgressTo(e.touches[0].clientX);
  window.addEventListener('touchmove',modalDragMove);
  window.addEventListener('touchend',modalDragEnd);
},{passive:true});
function modalDragMove(e){
  if(!isModalDragging)return;
  if(e.touches && e.touches.length>0)setModalProgressTo(e.touches[0].clientX);
  else setModalProgressTo(e.clientX);
}
function modalDragEnd(e){
  isModalDragging=false;
  window.removeEventListener('mousemove',modalDragMove);
  window.removeEventListener('mouseup',modalDragEnd);
  window.removeEventListener('touchmove',modalDragMove);
  window.removeEventListener('touchend',modalDragEnd);
}
modalProgress.addEventListener('click',function(e){
  if(!isModalDragging)setModalProgressTo(e.clientX ?? (e.touches&&e.touches.length>0?e.touches[0].clientX:0));
});

function updateGotoPlayerBtn() {
  if(!modal.classList.contains('active') && typeof lastModalOpenIdx === 'number' && lastModalOpenIdx >= 0) {
    gotoPlayerBtn.style.display = "block";
  } else {
    gotoPlayerBtn.style.display = "none";
  }
}
gotoPlayerBtn.onclick = function() {
  if(typeof lastModalOpenIdx === 'number' && lastModalOpenIdx >= 0) {
    openModal(lastModalOpenIdx);
  }
};
['click','keydown'].forEach(evt=>{
  document.body.addEventListener(evt,updateGotoPlayerBtn,true);
});

document.querySelectorAll('.nav-link').forEach(btn=>{
  btn.onclick=function(){
    if(this.classList.contains('active'))return;
    switchPage(this.dataset.page);
    if(modal.classList.contains('active')) closeModal();
    updateGotoPlayerBtn();
    playerCache.time = audio.currentTime; playerCache.idx = currentIdx;
    playerCache.isPlaying = !audio.paused; playerCache.volume = audio.volume;
    persistPlayerCache();
  }
});

// --------- 初始化 --------
(function(){
  switchPage("home");
  retrievePlayerCache();
  playSong(playerCache.idx||0,false,playerCache);
  updateGotoPlayerBtn();
})();
